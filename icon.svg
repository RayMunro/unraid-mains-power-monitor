<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mains Power Monitor</title>
  <desc id="desc">A power plug with radiating signal waves and a lightning bolt, representing mains-loss detection via a monitored network device.</desc>
  <defs>
    <linearGradient id="plugGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa0e0"/>
      <stop offset="1" stop-color="#1f6fb0"/>
    </linearGradient>
  </defs>

  <!-- signal / ping waves -->
  <g stroke="#8fc7ef" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M180 150a190 190 0 0 1 152 0"/>
    <path d="M208 196a130 130 0 0 1 96 0"/>
  </g>

  <!-- plug body -->
  <rect x="196" y="224" width="120" height="96" rx="16" fill="url(#plugGrad)"/>
  <rect x="220" y="196" width="18" height="40" rx="6" fill="url(#plugGrad)"/>
  <rect x="274" y="196" width="18" height="40" rx="6" fill="url(#plugGrad)"/>
  <path d="M256 320v40" stroke="#1f6fb0" stroke-width="16" stroke-linecap="round"/>

  <!-- base / outlet -->
  <rect x="176" y="368" width="160" height="26" rx="13" fill="#0b2a44"/>

  <!-- lightning bolt badge -->
  <circle cx="356" cy="330" r="46" fill="#f1892c"/>
  <path d="M362 302l-30 40h20l-8 36 34-44h-20z" fill="#ffffff"/>
</svg>
